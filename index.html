
<!DOCTYPE html>
<html>
<head>
    <title>Juego de memoria</title>
</head>
<body>

    <h1>Juego de memoria</h1>
    <p id="mensaje">Presiona comenzar para jugar.</p>

    <h2 id="nivel">Nivel 1</h2>

    <button onclick="comenzar()">Comenzar</button>

    <h2 id="secuencia"></h2>

    <p>Repite el orden:</p>

    <button onclick="elegir('🔴')">🔴</button>
    <button onclick="elegir('🔵')">🔵</button>
    <button onclick="elegir('🟢')">🟢</button>
    <button onclick="elegir('🟡')">🟡</button>

    <script>

        let colores = ["🔴", "🔵", "🟢", "🟡"];
        let secuencia = [];
        let respuesta = [];
        let nivel = 1;
        let jugando = false;

        function comenzar() {
            secuencia = [];
            respuesta = [];
            jugando = false;

            for (let i = 0; i < Math.pow(2, nivel); i++) {
                let numero = Math.floor(Math.random() * 4);
                secuencia.push(colores[numero]);
            }

            document.getElementById("nivel").innerText = "Nivel " + nivel;
            document.getElementById("mensaje").innerText = "Observa los emojis";
            document.getElementById("secuencia").innerText = secuencia.join(" ");

            setTimeout(function() {
                document.getElementById("secuencia").innerText = "";
                document.getElementById("mensaje").innerText = "¡Tu turno! Repite la secuencia.";
                jugando = true;
            }, 5000);
        }

        function elegir(color) {
            if (!jugando) return;

            respuesta.push(color);

            document.getElementById("secuencia").innerText = respuesta.join(" ");

            let posicion = respuesta.length - 1;

            if (respuesta[posicion] != secuencia[posicion]) {
                document.getElementById("mensaje").innerText = "¡Te equivocaste! Intenta nuevamente.";
                jugando = false;
                return;
            }

            if (respuesta.length == secuencia.length) {
                document.getElementById("mensaje").innerText = "¡Excelente! Nivel completado.";
                jugando = false;
                nivel++;
            }
        }

    </script>

</body>
</html>
